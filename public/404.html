<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Zushy</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // GitHub Pages serves this file for any path with no matching static
      // file (e.g. /dashboard/pedidos) — it repackages that path into a
      // query string and bounces to index.html, which unpacks it back into
      // a real history entry before the app boots (see index.html).
      var pathSegmentsToKeep = 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
